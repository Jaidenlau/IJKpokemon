<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Graded card slab">
  <defs>
    <linearGradient id="slabBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f6ede0"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="#b8924f" stroke-width="1.6" stroke-linejoin="round">
    <!-- second slab behind -->
    <g opacity=".4" transform="rotate(-11 200 130)">
      <rect x="112" y="40" width="118" height="180" rx="10" fill="#fdfaf5"/>
    </g>
    <!-- main slab -->
    <rect x="146" y="34" width="122" height="192" rx="11" fill="url(#slabBody)"/>
    <!-- grading label -->
    <rect x="156" y="44" width="102" height="34" rx="5" fill="#f1e6cf"/>
    <path d="M166 56h58" opacity=".5"/>
    <path d="M166 66h40" opacity=".32"/>
    <text x="243" y="67" font-family="Jost, Helvetica, Arial, sans-serif" font-size="17" fill="#b8924f" stroke="none" text-anchor="end">10</text>
    <!-- encased card -->
    <rect x="160" y="88" width="94" height="126" rx="6" fill="#fdfaf5"/>
    <rect x="169" y="97" width="76" height="58" rx="4" fill="#f1e6cf" opacity=".7"/>
    <circle cx="207" cy="126" r="11"/>
    <path d="M196 126h22"/>
    <circle cx="207" cy="126" r="3.8"/>
    <path d="M169 170h76" opacity=".42"/>
    <path d="M169 182h54" opacity=".28"/>
    <path d="M169 194h64" opacity=".28"/>
  </g>
</svg>
