<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Sealed booster box">
  <defs>
    <linearGradient id="sealedFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfaf5"/><stop offset="1" stop-color="#f1e6cf"/>
    </linearGradient>
    <linearGradient id="sealedTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf5ea"/><stop offset="1" stop-color="#e4d2a9"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="#b8924f" stroke-width="1.6" stroke-linejoin="round">
    <!-- cards fanned behind the box -->
    <g opacity=".45">
      <rect x="88" y="70" width="62" height="88" rx="5" transform="rotate(-18 119 114)" fill="#fdfaf5"/>
      <rect x="100" y="64" width="62" height="88" rx="5" transform="rotate(-8 131 108)" fill="#fdfaf5"/>
    </g>
    <!-- box -->
    <polygon points="150,104 262,104 262,226 150,226" fill="url(#sealedFace)"/>
    <polygon points="150,104 262,104 300,74 188,74" fill="url(#sealedTop)"/>
    <polygon points="262,104 300,74 300,196 262,226" fill="#f1e6cf"/>
    <!-- front banner -->
    <path d="M150 146h112" opacity=".55"/>
    <path d="M150 158h112" opacity=".3"/>
    <!-- shrink-wrap highlight -->
    <path d="M176 104 208 226" opacity=".22"/>
    <path d="M232 104 252 226" opacity=".16"/>
    <!-- ball motif on the box face -->
    <circle cx="206" cy="128" r="13"/>
    <path d="M193 128h26"/>
    <circle cx="206" cy="128" r="4.4"/>
  </g>
</svg>
